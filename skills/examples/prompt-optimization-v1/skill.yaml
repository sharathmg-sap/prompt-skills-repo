id: prompt-optimization-v1
name: Prompt Optimization
version: "1.0.0"
status: stable
author: Sharath M G
date_created: "2026-08-24"
last_updated: "2026-08-24"

description: |
  Automatically optimize, analyze, and validate prompts for better efficiency,
  lower token costs, and improved quality. This skill leverages the
  prompt-token-optimizer Python package to provide comprehensive prompt
  analysis and optimization capabilities.

tags:
  - prompt-optimization
  - token-efficiency
  - nlp
  - prompt-engineering
  - cost-optimization
  - quality-assurance

purpose: |
  This skill addresses the critical need to:
  - Reduce token consumption and associated costs
  - Maintain semantic meaning while improving efficiency
  - Validate prompt quality and safety
  - Provide actionable optimization suggestions
  - Analyze prompt structure and intent

use_cases:
  - id: cost-optimization
    title: Cost Optimization
    description: Reduce LLM API costs by minimizing token usage
  - id: quality-assurance
    title: Quality Assurance
    description: Validate prompts before deployment
  - id: performance-analysis
    title: Performance Analysis
    description: Understand prompt structure and effectiveness
  - id: prompt-engineering
    title: Prompt Engineering
    description: Get data-driven suggestions for improvement
  - id: batch-processing
    title: Batch Processing
    description: Optimize multiple prompts efficiently
  - id: token-budgeting
    title: Token Budgeting
    description: Estimate and manage token allocation

capabilities:
  - id: token-counting
    name: Token Counting
    description: Count approximate tokens for various LLM models
    models_supported:
      - gpt-3.5-turbo
      - gpt-4
      - claude
  - id: prompt-optimization
    name: Prompt Optimization
    description: Compress prompts while maintaining semantic meaning
    features:
      - Remove redundant and filler words
      - Optimize message conversations
      - Target-based token reduction
  - id: semantic-analysis
    name: Semantic Analysis
    description: Analyze prompt structure and meaning
    features:
      - Extract keywords and key phrases
      - Calculate vocabulary diversity
      - Analyze prompt structure
      - Detect intent and purpose
  - id: validation
    name: Validation
    description: Comprehensive prompt quality checks
    features:
      - Validate prompt length and structure
      - Check encoding and special characters
      - Verify word count requirements
      - Generate validation reports
  - id: optimization-suggestions
    name: Optimization Suggestions
    description: Provide actionable recommendations
    features:
      - Identify redundancy issues
      - Detect filler words
      - Suggest length optimizations
      - Provide impact assessment

requirements:
  system:
    python: ">=3.8"
  dependencies:
    - name: prompt-token-optimizer
      version: ">=0.1.0"
      installation: "pip install prompt-token-optimizer"
    - name: pip
      version: ">=20.0"

installation:
  type: package
  package_manager: pip
  commands:
    - name: Clone Repository
      command: git clone https://github.com/sharathmg-sap/prompt-token-optimizer.git
    - name: Install Package
      command: pip install -e .
    - name: Verify Installation
      command: promptopt --help

quick_start: |
  from promptopt import PromptOptimizer, TokenCounter
  from promptopt.token_counter import ModelType

  # Initialize components
  optimizer = PromptOptimizer(ModelType.GPT3)
  counter = TokenCounter(ModelType.GPT3)

  # Count tokens
  tokens = counter.count_tokens("Your prompt here")
  print(f"Tokens: {tokens}")

  # Optimize a prompt
  optimized = optimizer.compress_prompt("Your long prompt", target_token_reduction=0.2)
  print(f"Optimized: {optimized}")

input_schema:
  type: object
  required:
    - prompt
  properties:
    prompt:
      type: string
      description: The prompt text to optimize
      minLength: 10
      maxLength: 100000
    model:
      type: string
      description: LLM model for token counting
      enum: ["gpt-3.5-turbo", "gpt-4", "claude"]
      default: "gpt-3.5-turbo"
    target_reduction:
      type: number
      description: Target token reduction percentage (0-1)
      minimum: 0
      maximum: 1
      default: 0.2
    operation:
      type: string
      description: Operation to perform
      enum:
        - count
        - optimize
        - validate
        - analyze
        - suggest
      default: optimize
    output_format:
      type: string
      description: Output format for results
      enum: ["json", "text", "markdown"]
      default: "json"

output_schema:
  type: object
  properties:
    status:
      type: string
      enum: ["success", "error"]
    original_tokens:
      type: integer
      description: Token count of original prompt
    optimized_tokens:
      type: integer
      description: Token count after optimization
    reduction_percentage:
      type: number
      description: Percentage of tokens reduced
    optimized_prompt:
      type: string
      description: The optimized prompt text
    suggestions:
      type: array
      items:
        type: object
        properties:
          type:
            type: string
          message:
            type: string
          impact:
            type: string
            enum: ["low", "medium", "high"]
    validation_report:
      type: object
      properties:
        is_valid:
          type: boolean
        errors:
          type: array
          items:
            type: string
    analysis:
      type: object
      properties:
        keywords:
          type: array
        diversity:
          type: number
        intent:
          type: string
        structure:
          type: object
    metadata:
      type: object
      properties:
        model:
          type: string
        duration_ms:
          type: integer
        version:
          type: string

modules:
  - name: token_counter
    path: promptopt/token_counter.py
    description: Token counting for different LLM models
    classes:
      - TokenCounter
      - ModelType
  - name: optimizer
    path: promptopt/optimizer.py
    description: Prompt compression and optimization
    classes:
      - PromptOptimizer
  - name: semantic
    path: promptopt/semantic.py
    description: Semantic analysis and structure analysis
    classes:
      - SemanticAnalyzer
  - name: validators
    path: promptopt/validators.py
    description: Comprehensive validation
    classes:
      - PromptValidator
  - name: cli
    path: promptopt/cli.py
    description: Command-line interface
    functions:
      - main

workflow:
  steps:
    - step: 1
      name: Validate Input
      description: Check if prompt meets basic requirements
      module: validators
      implementation: |
        from promptopt.validators import PromptValidator
        validator = PromptValidator()
        is_valid, errors = validator.validate_all(prompt)
    - step: 2
      name: Count Original Tokens
      description: Calculate token count before optimization
      module: token_counter
      implementation: |
        from promptopt.token_counter import TokenCounter, ModelType
        counter = TokenCounter(ModelType.GPT3)
        original_tokens = counter.count_tokens(prompt)
    - step: 3
      name: Analyze Semantics
      description: Extract keywords and detect intent
      module: semantic
      implementation: |
        from promptopt.semantic import SemanticAnalyzer
        analyzer = SemanticAnalyzer()
        analysis = analyzer.get_semantic_analysis(prompt)
    - step: 4
      name: Optimize Prompt
      description: Compress while maintaining meaning
      module: optimizer
      implementation: |
        from promptopt.optimizer import PromptOptimizer
        optimizer = PromptOptimizer(ModelType.GPT3)
        optimized = optimizer.compress_prompt(prompt, target_token_reduction=0.2)
    - step: 5
      name: Generate Suggestions
      description: Provide actionable recommendations
      module: optimizer
      implementation: |
        suggestions = optimizer.get_optimization_suggestions(prompt)

examples:
  - id: example-1
    title: Basic Token Counting
    description: Count tokens in a prompt for cost estimation
    objective: Determine token usage and estimated costs
    code: |
      from promptopt.token_counter import TokenCounter, ModelType

      prompt = """You are a helpful assistant. Please analyze this document
      and provide a comprehensive summary with key points."""

      counter = TokenCounter(ModelType.GPT3)
      tokens = counter.count_tokens(prompt)
      cost = counter.estimate_cost(tokens, input_cost_per_1k=0.0005)

      print(f"Tokens: {tokens}")
      print(f"Estimated cost: ${cost:.4f}")
    output: |
      Tokens: 27
      Estimated cost: $0.0000

  - id: example-2
    title: Optimize Long Prompt
    description: Reduce token usage while maintaining meaning
    objective: Achieve 25% token reduction without losing context
    code: |
      from promptopt.optimizer import PromptOptimizer
      from promptopt.token_counter import TokenCounter, ModelType

      original_prompt = """Please, I am really requesting you to very carefully
      and thoroughly analyze and evaluate this important document."""

      optimizer = PromptOptimizer(ModelType.GPT3)
      optimized = optimizer.compress_prompt(original_prompt, target_token_reduction=0.25)

      counter = TokenCounter(ModelType.GPT3)
      original_tokens = counter.count_tokens(original_prompt)
      optimized_tokens = counter.count_tokens(optimized)

      print(f"Original: {original_tokens} tokens")
      print(f"Optimized: {optimized_tokens} tokens")
      print(f"Reduction: {((original_tokens - optimized_tokens) / original_tokens) * 100:.1f}%")
    output: |
      Original: 35 tokens
      Optimized: 26 tokens
      Reduction: 25.7%

  - id: example-3
    title: Batch Validate Prompts
    description: Validate multiple prompts before deployment
    objective: Ensure all prompts meet quality standards
    code: |
      from promptopt.validators import PromptValidator

      validator = PromptValidator()
      prompts = [
          "Valid prompt with sufficient content and structure.",
          "Short",
          "!!!###@@@",
      ]

      for prompt in prompts:
          report = validator.get_validation_report(prompt)
          status = "✓" if report['is_valid'] else "✗"
          print(f"{status}: {prompt[:40]}")
    output: |
      ✓: Valid prompt with sufficient content and struc
      ✗: Short
      ✗: !!!###@@@

  - id: example-4
    title: Semantic Analysis
    description: Understand prompt structure and intent
    objective: Extract insights about prompt composition
    code: |
      from promptopt.semantic import SemanticAnalyzer

      analyzer = SemanticAnalyzer()
      prompt = "What are the benefits of machine learning?"
      analysis = analyzer.get_semantic_analysis(prompt)

      print("Keywords:", analysis['keywords'][:5])
      print("Diversity:", f"{analysis['diversity']:.2%}")
      print("Intent:", analysis['intent']['primary_intent'])
    output: |
      Keywords: [('benefits', 1), ('machine', 1), ('learning', 1)]
      Diversity: 100.00%
      Intent: question

  - id: example-5
    title: Optimize Conversations
    description: Optimize multi-turn conversations
    objective: Reduce token usage in message threads
    code: |
      from promptopt.optimizer import PromptOptimizer

      optimizer = PromptOptimizer()
      messages = [
          {"role": "user", "content": "I need help understanding ML."},
          {"role": "assistant", "content": "ML is a crucial field in AI."}
      ]

      optimized_messages, stats = optimizer.optimize_messages(messages)
      print(f"Original: {stats['original_tokens']} tokens")
      print(f"Optimized: {stats['optimized_tokens']} tokens")
      print(f"Reduction: {stats['reduction_percentage']:.1f}%")
    output: |
      Original: 30 tokens
      Optimized: 27 tokens
      Reduction: 10.0%

cli_commands:
  - command: promptopt count
    description: Count tokens in a prompt
    usage: promptopt count "Your prompt here" --model gpt-3.5-turbo
  - command: promptopt optimize
    description: Optimize a prompt
    usage: promptopt optimize "Your long prompt" --reduction 0.2 --output optimized.txt
  - command: promptopt validate
    description: Validate a prompt
    usage: promptopt validate "Your prompt here"
  - command: promptopt analyze
    description: Analyze prompt semantics
    usage: promptopt analyze "Your prompt here"
  - command: promptopt suggest
    description: Get optimization suggestions
    usage: promptopt suggest "Your prompt here"

configuration:
  validation_rules:
    min_length: 10
    max_length: 100000
    min_words: 1
    max_special_chars_ratio: 0.3
  supported_models:
    - name: GPT-3.5 Turbo
      identifier: GPT3
      token_ratio: 1.0
    - name: GPT-4
      identifier: GPT4
      token_ratio: 1.0
    - name: Claude
      identifier: CLAUDE
      token_ratio: 0.95
  optimization_targets:
    - target: low
      reduction: 0.1
      risk: minimal
    - target: medium
      reduction: 0.2
      risk: low
    - target: high
      reduction: 0.3
      risk: medium

performance:
  token_counting:
    time_complexity: O(n)
    average_time: "5ms per 1000 tokens"
  optimization:
    time_complexity: O(n)
    average_time: "50ms for typical prompts"
  validation:
    time_complexity: O(n)
    average_time: "10ms per prompt"
  semantic_analysis:
    time_complexity: O(n)
    average_time: "30ms per prompt"

best_practices:
  - id: practice-1
    title: Always Validate First
    description: Check prompt validity before optimization
    code: |
      is_valid, errors = validator.validate_all(prompt)
      if not is_valid:
          return errors
  - id: practice-2
    title: Incremental Optimization
    description: Start with 10-20% reduction target
  - id: practice-3
    title: Monitor Token Changes
    description: Always compare before/after token counts
  - id: practice-4
    title: Use Intent Detection
    description: Understand prompt purpose before optimizing
  - id: practice-5
    title: Batch Processing
    description: For multiple prompts, use batch optimization

error_handling:
  - error_type: ValidationError
    cause: Invalid input or encoding
    solution: Use validate_all() to identify issues
  - error_type: TokenCountError
    cause: Model mismatch or invalid text
    solution: Select correct ModelType and verify text encoding
  - error_type: OptimizationError
    cause: Cannot achieve target reduction
    solution: Lower target_token_reduction or simplify content
  - error_type: SemanticError
    cause: Unable to analyze structure
    solution: Ensure prompt is well-formed text

limitations:
  - Token counts are approximate (±5-10% variance)
  - Optimization preserves semantic meaning but may change style
  - Special characters in structured data may be preserved
  - Some domain-specific terminology may not be optimized
  - Analysis requires minimum prompt length (10 characters)

future_enhancements:
  - Integration with actual tokenizers (tiktoken)
  - Multi-language support
  - Custom semantic preservation rules
  - Advanced compression algorithms
  - Real-time optimization dashboard

testing:
  framework: pytest
  coverage: "85%+"
  test_commands:
